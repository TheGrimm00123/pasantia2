<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin titulo</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:url("https://www.transparenttextures.com/patterns/wood-pattern.png") repeat center/300px;
font-family:Georgia,serif;
margin:0;
color:white;
}

.biblioteca{
padding:15px;
}

.fila{
display:flex;
justify-content:center;
gap:6px;
flex-wrap:wrap;
margin-bottom:5px;
}

.estante{
height:10px;
background:linear-gradient(#8b5a2b,#5a3a1a);
margin-bottom:25px;
border-radius:2px;
box-shadow:0 5px 10px rgba(0,0,0,.6);
}

.libro{
width:50px;
height:170px;
border-radius:4px;
border:2px solid silver;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
transition:.3s;
}

.libro:hover{
transform:scale(1.05);
}

.lomo{
writing-mode:vertical-rl;
transform:rotate(180deg);
font-size:12px;
font-weight:bold;
letter-spacing:1px;
}

.rojo{background:linear-gradient(#7b1e3a,#b33951)}
.rosa{background:linear-gradient(#c2185b,#f06292)}
.morado{background:linear-gradient(#000000,#000000)}
.vino{background:linear-gradient(#4a001f,#7b1e3a)}
.carmesi{background:linear-gradient(#8b0000,#d32f2f)}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.75);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:.4s;
}

.libro-abierto{
width:420px;
max-width:95%;
height:260px;
display:flex;
background:#e6d3a3;
border-radius:10px;
box-shadow:0 20px 40px rgba(0,0,0,.8);
transform:scale(.6);
transition:.5s;
overflow:hidden;
}

.pagina{
flex:1;
padding:18px;
background:#f1e3c1;
border-right:2px solid #c9b384;
overflow:hidden;
}

.pagina:last-child{
border-right:none;
}

.titulo{
font-size:18px;
font-weight:bold;
margin-bottom:8px;
color:#5a1a18;
}

.texto{
font-size:14px;
line-height:1.4;
color: #000000;
}

.cerrar{
position:absolute;
top:20px;
right:25px;
font-size:28px;
cursor:pointer;
}

</style>
</head>

<body>

Te quiero! 

<footer style="width:100%;text-align:center;padding:20px;color:black;font-family:Georgia,serif;">

</footer>

</body>
</html>
